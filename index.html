<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="description" content="Mapa interactivo de fuentes de agua potable: OpenStreetMap en todo el mundo y datos oficiales verificados donde existen." />
  <meta name="theme-color" content="#0085c7" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Fountly" />
  <title>Fountly — Fuentes de agua potable</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Mapa a pantalla completa -->
  <div id="map" role="application" aria-label="Mapa de fuentes de agua potable"></div>

  <!-- Buscador de zonas (glass): el elemento principal, arriba en el centro -->
  <div class="search" id="search">
    <div class="search__box glass">
      <svg class="search__icon icon" xmlns="http://www.w3.org/2000/svg" fill="none"
           viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607z" />
      </svg>
      <input id="search-input" class="search__input" type="search"
             placeholder="Buscar ciudad o zona…" autocomplete="off"
             spellcheck="false" role="combobox" aria-expanded="false"
             aria-controls="search-listbox" aria-autocomplete="list"
             aria-label="Buscar ciudad o zona" />
      <button type="button" class="search__clear" id="search-clear"
              aria-label="Borrar búsqueda" hidden>
        <svg class="icon icon--sm" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <ul class="search__results glass" id="search-listbox" role="listbox"
        aria-label="Sugerencias" hidden></ul>
  </div>

  <!-- Contador de fuentes en el viewport (bajo el buscador) -->
  <div class="toolbar">
    <span class="count glass" id="count" hidden></span>
  </div>

  <!-- Mensajes transitorios -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Botón "Cerca de mí" -->
  <button type="button" id="locate-btn" class="fab glass" title="Buscar fuentes cerca de mí" aria-label="Buscar fuentes cerca de mí">
    <svg class="fab__icon icon" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0z" />
    </svg>
    <span class="fab__label">Cerca de mí</span>
  </button>

  <!-- Lista de fuentes cercanas (colapsable; se abre tras geolocalización) -->
  <aside id="nearby" class="nearby glass" aria-label="Fuentes cercanas" hidden>
    <div class="nearby__bar">
      <button type="button" class="nearby__toggle" id="nearby-toggle"
              aria-expanded="true" aria-controls="nearby-body">
        <span class="nearby__title" id="nearby-title">Cercanas</span>
        <svg class="nearby__chevron icon icon--sm" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>
      <button type="button" class="nearby__close" id="nearby-close"
              aria-label="Cerrar lista de cercanas">
        <svg class="icon icon--sm" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="nearby__body" id="nearby-body">
      <ul class="nearby__list" id="nearby-list" role="list"></ul>
      <p class="nearby__empty" id="nearby-empty" hidden>
        No hay fuentes en el radio. Acércate o mueve el mapa para cargar más.
      </p>
    </div>
  </aside>

  <!-- Panel de detalle (bottom sheet, glass) -->
  <aside id="sheet" class="sheet glass" aria-label="Detalle de la fuente" hidden>
    <button type="button" id="sheet-close" class="sheet__close" aria-label="Cerrar">
      <svg class="icon icon--sm" xmlns="http://www.w3.org/2000/svg" fill="none"
           viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="sheet__handle" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </aside>

  <!-- Aplicación (Vite bundlea JS y CSS de MapLibre) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
